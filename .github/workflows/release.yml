# A release is delivery, not deployment. It publishes reproducible artifacts;
# choosing a live host and running migrations remain explicit operator actions.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Match tag to package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
      - run: node scripts/check-version.mjs "$GITHUB_REF_NAME"

  verify:
    name: Complete CI gate
    needs: version
    uses: ./.github/workflows/verify.yml

  e2e:
    name: Browser acceptance
    needs: version
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chatty
          POSTGRES_PASSWORD: chatty
          POSTGRES_DB: chatty_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/server/prisma/schema.prisma
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:built

  images:
    name: Publish ${{ matrix.name }} image
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: apps/server/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/chatty-${{ matrix.name }}:${{ github.ref_name }}
          # The RC defaults to same-machine acceptance. Set this repository
          # variable before a public release so the static web image targets
          # the verified API domain; the server image safely ignores the arg.
          build-args: VITE_API_URL=${{ vars.CHATTY_PUBLIC_API_URL || 'http://localhost:4000' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=${{ matrix.name }}

  release:
    name: Publish GitHub Release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create release from the immutable tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}"
