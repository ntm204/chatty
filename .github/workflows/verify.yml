# Local verification follows changed imports for fast feedback. CI keeps the
# complete gate and shortens wall time by running its independent parts at once.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A second push makes every answer from the previous run obsolete.
concurrency:
  # Keep this distinct from the release workflow's group when it calls this
  # file as a reusable gate; identical groups can cancel their own caller.
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, format and conventions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/server/prisma/schema.prisma
      - run: npm run version:check
      - run: node scripts/check-experience-progress.mjs --json
      - run: npm run test:tooling
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run verify:audit

  server-tests:
    name: Server tests ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      # Every shard gets its own runner and database, so the suite's per-test
      # truncation remains isolated while both halves run concurrently.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chatty
          POSTGRES_PASSWORD: chatty
          POSTGRES_DB: chatty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/server/prisma/schema.prisma
      - run: npm run test --workspace apps/server -- --shard=${{ matrix.shard }}/2

  web-tests:
    name: Web tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: npm
      - run: npm ci
      - run: npm run test --workspace apps/web

  images:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: apps/server/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: chatty-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=${{ matrix.name }}

  # Preserve one stable required check while making it depend on every parallel
  # job. A green `verify` therefore still means the complete gate passed.
  verify:
    name: verify
    if: ${{ always() }}
    needs: [quality, server-tests, web-tests, images]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        env:
          QUALITY: ${{ needs.quality.result }}
          SERVER_TESTS: ${{ needs.server-tests.result }}
          WEB_TESTS: ${{ needs.web-tests.result }}
          IMAGES: ${{ needs.images.result }}
        run: |
          test "$QUALITY" = success
          test "$SERVER_TESTS" = success
          test "$WEB_TESTS" = success
          test "$IMAGES" = success
