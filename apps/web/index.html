<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Chatty</title>
		<meta
			name="description"
			content="A colorful little corner for your everyday people. Catch up, share a moment, and make yourself at home on Chatty."
		/>
		<meta name="theme-color" content="#354ac4" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<!--
			Blocking, and in the head on purpose: it stamps the resolved theme on
			<html> before the body paints. Deferred, or moved below the root div,
			and every dark-theme reader gets a white flash on every navigation.
			See the comment in the file for why it is not inline.
		-->
		<script src="/theme.js"></script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
